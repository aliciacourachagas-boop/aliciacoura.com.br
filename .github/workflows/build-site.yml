name: Preparar paginas e metadados do portfolio
on:
  push:
    paths:
      - 'site-parts/**'
      - 'scripts/build_shareable_site.py'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Gerar nove paginas com URL proprio e metadados
        run: python3 scripts/build_shareable_site.py
      - name: Salvar paginas estaticas e sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html projetos/index.html publicacoes/index.html videos/index.html musica/index.html sobre/index.html bio-extratus/index.html batekoo/index.html documentario-dj/index.html sitemap.xml robots.txt .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publica paginas individuais com metadados Open Graph"
            git push
          fi
